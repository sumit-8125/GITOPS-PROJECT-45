apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Values.serviceAccount.name | default "backend" }}
rules:
- apiGroups: [""]
  resources: ["pods", "nodes"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Values.serviceAccount.name | default "backend" }}
subjects:
- kind: ServiceAccount
  name: {{ .Values.serviceAccount.name | default "backend" }}
  namespace: {{ .Release.Namespace | default "backend" }}
roleRef:
  kind: ClusterRole
  name: {{ .Values.serviceAccount.name | default "backend" }}
  apiGroup: rbac.authorization.k8s.io
