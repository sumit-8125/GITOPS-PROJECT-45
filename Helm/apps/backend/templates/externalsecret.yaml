apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backend-runtime
  namespace: backend
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: backend-runtime
    creationPolicy: Owner
  # Extracts DATABASE_URL, JWT_SECRET, and CORS_ORIGINS from AWS Secrets Manager
  dataFrom:
  - extract:
      key: {{ .Values.secretKey | default "cloudflux/prod/backend" }}
