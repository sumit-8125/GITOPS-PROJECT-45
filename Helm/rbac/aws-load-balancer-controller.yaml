apiVersion: v1
kind: ServiceAccount
metadata:
  name: aws-load-balancer-controller
  namespace: aws-load-balancer-controller
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::327425719754:role/hitman-cloudflux-prod-aws-lb-controller
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: aws-load-balancer-controller
rules:
- apiGroups: [""]
  resources: [pods,nodes,services,endpoints,events,configmaps,secrets]
  verbs: [get,list,watch]
- apiGroups: ["networking.k8s.io"]
  resources: [ingresses,ingresses/status,ingressclasses]
  verbs: [get,list,watch,update,patch]
- apiGroups: ["elbv2.k8s.aws"]
  resources: [targetgroupbindings,targetgroupbindings/status]
  verbs: [get,list,watch,create,update,patch,delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: aws-load-balancer-controller
subjects:
- kind: ServiceAccount
  name: aws-load-balancer-controller
  namespace: aws-load-balancer-controller
roleRef:
  kind: ClusterRole
  name: aws-load-balancer-controller
  apiGroup: rbac.authorization.k8s.io
