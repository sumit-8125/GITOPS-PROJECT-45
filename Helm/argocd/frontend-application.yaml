apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: {name: frontend, namespace: argocd}
spec:
  project: default
  source:
    repoURL: https://github.com/YOUR_GITHUB_ORG/gitops-repo.git
    targetRevision: main
    path: apps/frontend
  destination:
    server: https://kubernetes.default.svc
    namespace: frontend
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=false]
