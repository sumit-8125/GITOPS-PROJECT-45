apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: {name: backend, namespace: argocd}
spec:
  project: default
  source:
    repoURL: https://github.com/sumit-8125/GITOPS-PROJECT-45.git
    targetRevision: main
    path: Helm/apps/backend
  destination:
    server: https://kubernetes.default.svc
    namespace: backend
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=false]
