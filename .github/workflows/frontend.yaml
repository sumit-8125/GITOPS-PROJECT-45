name: "02 - Frontend CI Pipeline"

on:
  push:
    branches:
      - main
    paths:
      - "app/frontend/**"
      - ".github/workflows/frontend.yaml"
  workflow_dispatch:

permissions:
  id-token: write   # Required for AWS OIDC authentication
  contents: write   # Required to commit and push updated Helm values

env:
  AWS_REGION: "ap-south-1"
  ECR_REPOSITORY: "hitman-cloudflux/frontend"
  ROLE_TO_ASSUME: ${{ secrets.AWS_FRONTEND_ROLE_ARN || 'arn:aws:iam::ACCOUNT_ID:role/hitman-cloudflux-prod-github-frontend-ecr' }}
  HELM_VALUES_FILE: "Helm/apps/frontend/values.yaml"
  CONTEXT_DIR: "./app/frontend"

jobs:
  build-and-push:
    name: "Build, Push Frontend & Update Helm Values"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Image Tag (Git Commit SHA)
        id: vars
        run: echo "IMAGE_TAG=${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Assume AWS Role via OIDC (No Static Keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_TO_ASSUME }}
          role-session-name: GitHubActionsFrontendCI
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag, and Push Image to Amazon ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.vars.outputs.IMAGE_TAG }}
        run: |
          # Build docker image (using Dockerfile in frontend or apps/frontend if exists, fallback to placeholder if directory is pure chart)
          if [ -f "$CONTEXT_DIR/Dockerfile" ]; then
            docker build -t $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $REGISTRY/$ECR_REPOSITORY:latest $CONTEXT_DIR
          else
            echo "No Dockerfile found in $CONTEXT_DIR, building minimal production frontend container..."
            docker build -t $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $REGISTRY/$ECR_REPOSITORY:latest - <<EOF
          FROM nginx:alpine
          RUN echo "<h1>CloudFlux Frontend - SHA: $IMAGE_TAG</h1>" > /usr/share/nginx/html/index.html
          EXPOSE 80
          EOF
          fi
          docker push $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $REGISTRY/$ECR_REPOSITORY:latest

      - name: Update Helm Values (GitOps Source of Truth)
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.vars.outputs.IMAGE_TAG }}
        run: |
          # Update repository and tag in Helm values.yaml
          sed -i "s|repository:.*|repository: $REGISTRY/$ECR_REPOSITORY|g" $HELM_VALUES_FILE
          sed -i "s|tag:.*|tag: \"$IMAGE_TAG\"|g" $HELM_VALUES_FILE
          echo "Updated $HELM_VALUES_FILE with image tag $IMAGE_TAG"

      - name: Commit and Push Updated Helm Values (Triggers ArgoCD Sync)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add $HELM_VALUES_FILE
          if git diff --staged --quiet; then
            echo "No changes in $HELM_VALUES_FILE to commit."
          else
            git commit -m "ci(frontend): update image tag to ${{ steps.vars.outputs.IMAGE_TAG }} [skip ci]"
            git push origin main
          fi
